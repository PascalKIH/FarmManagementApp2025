<!DOCTYPE html>
<html lang="de" data-section="" data-subsection="">
<head>
  <meta charset="UTF-8" />
  <title>Farm Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Roboto -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --brand: #198754; }
    body { font-family: Roboto, system-ui, -apple-system, Segoe UI, Arial, sans-serif; }
    .navbar-brand { font-weight: 700; }
    .submenu-title { font-size: .85rem; letter-spacing: .04em; color: #6c757d; text-transform: uppercase; }
    .breadcrumb { --bs-breadcrumb-divider: "›"; }
    /* Mobile quick actions */
    @media (max-width: 767.98px) {
      #subactions { position: sticky; top: 56px; z-index: 1010; background: #fff; border-bottom: 1px solid #eee; }
      #subactions .btn { white-space: nowrap; }
      #subactions .btn + .btn { margin-left: .5rem; }
      .subactions-scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    }
  </style>
</head>
<body class="bg-light">

  <!-- Navbar  -->
  <div id="navbar-mount"></div>


  <div>
      <div class="container py-4">
          <h2 class="mb-4">Behandlungen – Übersicht</h2>
          <p>Verwalte alle Behandlungen deiner Tiere.</p>
      </div>
      <div class="container py-4">
          <div class="card">
              <div class="card-body">
                  <h5 class="card-title">Behandlungsübersicht</h5>
                  <p class="card-text">Hier findest du eine Übersicht über alle durchgeführten Behandlungen.</p>
                  <table class="table table-striped" id="treatment-overview-table">
                      <thead>
                          <tr>
                              <th>Tier ID</th>
                              <th>Behandlungsdatum</th>
                              <th>Diagnose</th>
                              <th>Eingesetztes Medikament</th>
                              <th>Nachbehandlung</th>
                          </tr>
                      </thead>
                      <tbody>
                          <!-- Dynamisch generierte Behandlungsdaten werden hier eingefügt -->
                      </tbody>
                  </table>

              </div>
          </div>
      </div>
  </div>
  <!-- Profil Modal (optional) -->
  <div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title">Profil</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p><strong>Benutzername:</strong> <span id="profile-username">—</span></p>
          <p><strong>E-Mail:</strong> <span id="profile-email">—</span></p>
          <p><strong>Farm:</strong> <span id="profile-farm">—</span></p>
          <p><strong>Farm-Code:</strong> <span id="profile-farmcode">—</span></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Schließen</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Bootstrap + Template JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/nav-base.js"></script>
  <script src="../js/nav-include.js"></script>

  <script src="treatment_overview.js"></script>
</body>
</html>
