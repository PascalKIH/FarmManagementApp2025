<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farm Manager - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->

  <div id="navbar-mount"></div>


  <!-- Dashboard Platzhalter -->
  <div class="container my-5">
    <div class="card shadow-sm">
      <div class="card-header bg-secondary text-white">
        Dashboard
      </div>
      <div class="card-body">
        <h4 class="card-title">Willkommen im Farm Manager 🐄</h4>
        <p id="farm-info" class="card-text">
          Lade Farm-Informationen ...
        </p>
        <div class="alert alert-info">
          📌 Hier wird später die Übersicht angezeigt (Tiere, Behandlungen, Orte).
        </div>
      </div>
    </div>
  </div>

  <!-- Profil Modal -->
  <div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title">Profil</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p><strong>Benutzername:</strong> <span id="profile-username"></span></p>
          <p><strong>E-Mail:</strong> <span id="profile-email"></span></p>
          <p><strong>Farm:</strong> <span id="profile-farm"></span></p>
          <p><strong>Farm-Code:</strong> <span id="profile-farmcode"></span></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Schließen</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Dashboard Logik -->
  <script src="dashboard.js"></script>
  <!-- Navigation-Pfade -->
  <script src="./nav-paths.js"></script>
  <script src="./nav-include.js"></script> 
</body>
</html>
