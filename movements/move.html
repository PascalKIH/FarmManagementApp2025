<!DOCTYPE html>
<html lang="de" data-section="" data-subsection="">
<head>
  <meta charset="UTF-8" />
  <title>Farm Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Roboto -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --brand: #198754; }
    body { font-family: Roboto, system-ui, -apple-system, Segoe UI, Arial, sans-serif; }
    .navbar-brand { font-weight: 700; }
    .submenu-title { font-size: .85rem; letter-spacing: .04em; color: #6c757d; text-transform: uppercase; }
    .breadcrumb { --bs-breadcrumb-divider: "›"; }
    /* Mobile quick actions */
    @media (max-width: 767.98px) {
      #subactions { position: sticky; top: 56px; z-index: 1010; background: #fff; border-bottom: 1px solid #eee; }
      #subactions .btn { white-space: nowrap; }
      #subactions .btn + .btn { margin-left: .5rem; }
      .subactions-scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    }
  </style>
</head>
<body class="bg-light">

  <!-- Navbar -->
  <div id="navbar-mount"></div>

  <!-- Breadcrumb -->
  <div class="container mt-3">
    <nav aria-label="breadcrumb">
      <ol id="breadcrumb" class="breadcrumb mb-2">
        <!-- wird dynamisch befüllt -->
      </ol>
    </nav>
    <h1 id="page-title" class="h3 fw-bold">Seitenüberschrift</h1>
    <p id="page-intro" class="text-muted">Kurze Beschreibung der Seite.</p>
  </div>

  <!-- Seiteninhalt -->
  <main class="container my-3" id="page-content">
    <!-- Deine Seite fügt hier den Inhalt ein -->
    <div class="alert alert-info">Platzhalter-Inhalt – bitte in der Seite ersetzen.</div>
  </main>

  <!-- Profil Modal (optional) -->
  <div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title">Profil</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p><strong>Benutzername:</strong> <span id="profile-username">—</span></p>
          <p><strong>E-Mail:</strong> <span id="profile-email">—</span></p>
          <p><strong>Farm:</strong> <span id="profile-farm">—</span></p>
          <p><strong>Farm-Code:</strong> <span id="profile-farmcode">—</span></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Schließen</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap + Template JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/nav-base.js"></script>
  <script src="../js/nav-include.js"></script>
  <script src="template.js"></script>
</body>
</html>
