
  <!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Tiere verwalten</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <div id="navbar-mount"></div>
  
<div class="container py-4">

<form id="move-animal-form" class="mb-4">
    <h5>Tier(e) verschieben</h5>
    <div class="mb-3">
      <label for="move-animal" class="form-label">Tiere auswählen</label>
      <select class="form-select" id="move-animal" multiple size="6"></select>
      <small class="text-muted">Halte STRG (Windows) oder CMD (Mac), um mehrere Tiere auszuwählen.</small>
    </div>
    <div class="mb-3">
      <label for="move-location" class="form-label">Aufenthaltsort auswählen</label>
      <select class="form-select" id="move-location"></select>
    </div>
    <button type="submit" class="btn btn-warning">Tiere verschieben</button>
  </form>
  

  <hr>

  <!-- Ort hinzufügen -->
  <form id="location-form">
    <h5>Neuen Aufenthaltsort hinzufügen</h5>
    <div class="mb-3">
      <label for="location-name" class="form-label">Name</label>
      <input type="text" class="form-control" id="location-name" required>
    </div>
    <div class="mb-3">
      <label for="location-capacity" class="form-label">Kapazität</label>
      <input type="number" class="form-control" id="location-capacity" required>
    </div>
    <button type="submit" class="btn btn-success">Ort speichern</button>
  </form>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/nav-base.js"></script>
  <script src="../js/nav-include.js"></script>
<script src="locations.js"></script>
</body>
</html>
