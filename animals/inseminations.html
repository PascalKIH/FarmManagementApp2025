<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Farm Manager – Tiere</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <!-- Navbar -->
  <div id="navbar-mount"></div>

  <div class="container mt-3">
    <nav aria-label="breadcrumb">
      <ol id="breadcrumb" class="breadcrumb mb-2">
        <!-- wird dynamisch befüllt -->
      </ol>
    </nav>

  <div class="container py-4">
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-success text-white">Besamung eintragen</div>
      <div class="card-body">
        <form id="insemination-form">
          <div class="mb-3">
            <div class="mb-3">
              <label for="insemination-animal" class="form-label">Tier auswählen</label>
              <select class="form-select" id="insemination-animal"></select>
            </div>
          </div>
          <div class="mb-3">
            <label for="insemination_date" class="form-label">Datum der Besamung</label>
            <input type="date" id="insemination_date" class="form-control" required>
          </div>

          <div class="row mb-3">
            <div class="col">
              <label for="bull_id" class="form-label">Bulle</label>
              <select id="bull_id" class="form-select" required>
                <option value="">Bitte auswählen</option>
              </select>
            </div>
            <div class="col d-flex align-items-end">
              <button type="button" id="add-bull-btn" class="btn btn-outline-primary col-6">+ Bullen hinzufügen</button>
            </div>
          </div>
            <button type="button" class="btn btn-success w-100">Speichern</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Profil Modal -->
  <div class="modal fade" id="profileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title">Profil</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p><strong>Benutzername:</strong> <span id="profile-username"></span></p>
          <p><strong>E-Mail:</strong> <span id="profile-email"></span></p>
          <p><strong>Farm:</strong> <span id="profile-farm"></span></p>
          <p><strong>Farm-Code:</strong> <span id="profile-farmcode"></span></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Schließen</button>
        </div>
      </div>
    </div>
  </div>
    <!-- add bull modal -->
    <div class="modal fade" id="addBullModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title">Neuen Bullen hinzufügen</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" ></button>
          </div>
          <div class="modal-body">
            <form id="add-bull-form">
              <div class="mb-3">
                <label for="bull-name" class="form-label">Name</label>
                <input type="text" class="form-control" id="bull-name" required>
              </div>
              <div class="mb-3">
                <label for="bull-breed" class="form-label">Rasse</label>
                <input type="text" class="form-control" id="bull-breed">
              </div>
              <button type="submit" class="btn btn-success" id="save-bull-btn">Bullen speichern</button>
            </form>
          </div>
        </div>
      </div>
  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/nav-base.js"></script>
  <script src="../js/nav-include.js"></script>
  <script src="inseminations.js"></script>
</body>

</html>
