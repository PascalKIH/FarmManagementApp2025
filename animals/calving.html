<!DOCTYPE html>
<html lang="de" data-section="" data-subsection="">
<head>
  <meta charset="UTF-8" />
  <title>Farm Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Roboto -->
  <link rel="stylesheet" href="../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

</head>
<body class="bg-light">

  <!-- Navbar -->
  <div id="navbar-mount"></div>



  <!-- Seitenkopf -->
  <div class="container my-4">
    <h1 id="page-title" class="h3 fw-bold">Abkalbung</h1>
    <p id="page-intro" class="text-muted">Trage eine Abkalbung für das Tier ein.</p>
  </div>

  <!-- Seiteninhalt -->
  <main class="container my-3" id="page-content">
    <!-- Deine Seite fügt hier den Inhalt ein -->
    <!-- Formular: Neues Tier -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-success text-white">Neues Tier hinzufügen</div>
      <div class="card-body">
        <form id="animal-form" novalidate>
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="animal_number" class="form-label">Stallnummer/Name</label>
              <input type="text" id="animal_number" class="form-control" required autocomplete="off" inputmode="text" placeholder="z. B. 541 / Bella">
            </div>
            <div class="col-12 col-md-6">
              <label for="animal_id" class="form-label">Tieridentifikationsnummer</label>
              <input type="text" id="animal_id" class="form-control" required autocomplete="off" inputmode="numeric" placeholder="z. B. DE 03 123456">
            </div>
            <div class="col-6 col-md-3">
              <label for="birth_date" class="form-label">Geburtsdatum</label>
              <input type="date" id="birth_date" class="form-control" required>
            </div>
            <div class="col-6 col-md-3">
              <label for="gender" class="form-label">Geschlecht</label>
              <select id="gender" class="form-select" required>
                <option value="">Bitte wählen</option>
                <option value="weiblich">Weiblich</option>
                <option value="männlich">Männlich</option>
                <option value="anderes">Anderes</option>
              </select>
            </div>
            <div class="col-12 col-md-3">
              <label for="mother_id" class="form-label">Mutter</label>
              <select id="mother_id" class="form-select">
                <option value="">Unbekannt</option>
              </select>
            </div>
            <div class="col-12 col-md-3">
              <label for="father_id" class="form-label">Vater</label>
              <select id="father_id" class="form-select">
                <option value="">Unbekannt</option>
              </select>
            </div>
          </div>
          <div class="d-grid d-sm-flex gap-2 justify-content-end mt-3">
            <button type="submit" class="btn btn-success tap">Speichern</button>
            <button type="button" id="reset-form" class="btn btn-outline-secondary tap">Zurücksetzen</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  
  <!-- Bootstrap + Template JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/nav-base.js"></script>
  <script src="../js/nav-include.js"></script>
  <script src="calving.js"></script>
</body>
</html>
